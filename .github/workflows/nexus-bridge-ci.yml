name: NEXUS Bridge CI

on:
  push:
    branches:
      - main
      - feat/nexus1000-bridge
      - fix/github-auth-verification
  pull_request:
    paths:
      - 'src/**'
      - 'python/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.cjs'
      - '.eslintrc.json'
      - '.github/workflows/nexus-bridge-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Python bridge syntax
        run: python -m py_compile python/nexus_bridge_runner.py
