name: Committed secret audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: inspect-committed-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check scanner behavior
        run: python3 -m unittest discover -s .github/security -p 'test_secret_audit.py'
      - name: Inspect tracked text and ZIP artifacts
        run: python3 .github/security/secret_audit.py
